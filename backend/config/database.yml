# Local defaults point at a dev Postgres; override with DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD.
# Production uses DATABASE_URL (set by Render).
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5434) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: acme_salaries_development

test:
  <<: *default
  database: acme_salaries_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
